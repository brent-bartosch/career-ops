# Query templates: archetype keywords x ATS platforms
# Each scan cycle builds SERP queries from this matrix

platforms:
  greenhouse:
    site_filter: "site:boards.greenhouse.io"
  lever:
    site_filter: "site:jobs.lever.co"
  ashby:
    site_filter: "site:jobs.ashbyhq.com"
  workday:
    site_filter: "site:myworkdayjobs.com"
  wellfound:
    site_filter: "site:wellfound.com/jobs"
  yc:
    site_filter: "site:workatastartup.com"
  indeed:
    site_filter: "site:indeed.com/viewjob OR site:indeed.com/jobs"
  linkedin:
    site_filter: "site:linkedin.com/jobs"
  # Contract / fractional platforms (curated marketplaces, not generic freelance)
  braintrust:
    site_filter: "site:app.usebraintrust.com OR site:usebraintrust.com"
  ateam:
    site_filter: "site:a.team"
  contra:
    site_filter: "site:contra.com"
  pallet:
    site_filter: "site:pallet.com"
  catalant:
    site_filter: "site:gocatalant.com OR site:catalant.com"

archetypes:
  revops_gtm_leader:
    label: "A — RevOps / GTM Ops Leader"
    keywords:
      - "revenue operations"
      - "sales operations"
      - "GTM operations"
      - "business operations"
      - "growth operations"
      - "revenue operations manager"
      - "head of revenue operations"
      - "director revenue operations"
      - "VP revenue operations"
      - "director sales operations"
      - "GTM strategy"

  solutions_architect:
    label: "B — Solutions Architect"
    keywords:
      - "solutions architect"
      - "GTM systems architect"
      - "sales engineer"
      - "technical strategist"
      - "integration architect"
      - "solutions engineer"
      - "pre-sales engineer"
      - "technical solutions"

  marketing_ops:
    label: "C — Marketing Ops / Marketing Technologist"
    keywords:
      - "marketing operations"
      - "marketing technologist"
      - "demand generation"
      - "growth engineer"
      - "marketing systems"
      - "marketing automation engineer"
      - "martech"
      - "marketing operations manager"
      - "director marketing operations"

  # Contract / fractional variants — shared across archetypes
  contract_fractional:
    label: "D — Contract / Fractional"
    keywords:
      - "fractional revops"
      - "fractional revenue operations"
      - "fractional CRO"
      - "fractional head of revenue"
      - "fractional GTM"
      - "fractional marketing operations"
      - "fractional CMO"
      - "fractional solutions architect"
      - "contract revops"
      - "contract revenue operations"
      - "contract GTM"
      - "contract marketing operations"
      - "contract solutions architect"
      - "interim head of revenue"
      - "interim VP revenue"
      - "interim head of marketing"
      - "revops consultant"
      - "GTM consultant"
      - "marketing operations consultant"
      - "solutions architect consultant"
      - "integration consultant"
